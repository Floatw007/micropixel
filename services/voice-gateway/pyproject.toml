[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "micropixel-voice-gateway"
version = "0.1.0"
description = "Provider-neutral streaming voice gateway for MicroPixel Bear"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=15,<16",
]

[project.scripts]
micropixel-voice-fixture = "micropixel_voice_gateway.fixture_client:main"

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1"]
opus = ["opuslib>=3,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/micropixel_voice_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
